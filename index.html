<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 Portfolio Challenge</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1>⚽ World Cup 2026 <span>Portfolio Challenge</span></h1>
      <p class="header-sub">Entries close <strong>Thursday 11 June</strong> &nbsp;·&nbsp; £5 to enter &nbsp;·&nbsp; Top 3 win</p>
    </div>
    <div class="header-right">
      <span id="last-updated" class="last-updated"></span>
      <button class="icon-btn" id="btn-refresh" title="Refresh scores">↻</button>
    </div>
  </div>
</header>

<nav>
  <button class="nav-btn active" data-tab="leaderboard">🏆 Leaderboard</button>
  <button class="nav-btn"        data-tab="teams">📊 Teams</button>
  <button class="nav-btn"        data-tab="matches">⚽ Matches</button>
</nav>

<main>
  <div id="banners"></div>

  <!-- Leaderboard tab -->
  <div id="tab-leaderboard" class="tab active">
    <div id="stats-grid" class="stats-grid"></div>
    <div class="card">
      <div class="card-title">🏆 Leaderboard</div>
      <div class="scrollable" id="leaderboard-body"></div>
    </div>
  </div>

  <!-- Teams tab -->
  <div id="tab-teams" class="tab">
    <div class="card">
      <div class="card-title">📊 Team Standings</div>
      <div class="scrollable">
        <table>
          <thead>
            <tr>
              <th>Team</th>
              <th>Cost</th>
              <th title="Wins">W</th>
              <th title="Draws">D</th>
              <th title="Losses">L</th>
              <th>Match Pts</th>
              <th>Progression</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="teams-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Matches tab -->
  <div id="tab-matches" class="tab">
    <div class="card">
      <div class="card-title">⚽ Matches</div>
      <div id="matches-body"></div>
    </div>
  </div>
</main>

<!-- Load order matters: data → scoring → loaders → renderers → app -->
<script src="js/data.js"></script>
<script src="js/scoring.js"></script>
<script src="js/loaders.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/teams.js"></script>
<script src="js/matches.js"></script>
<script src="js/app.js"></script>

</body>
</html>
