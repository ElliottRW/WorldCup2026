name: Update PL Clubs Data

on:
  schedule:
    - cron: '0 6 * * *'   # Once daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch PL clubs WC data
        run: |
          python3 << 'EOF'
          import json, subprocess, sys

          def fetch(url):
              r = subprocess.run(['curl', '-s', '--max-time', '15', url], capture_output=True, text=True)
              if r.returncode != 0 or not r.stdout.strip():
                  return None
              try:
                  return json.loads(r.stdout)
              except:
                  return None

          # ESPN name → football-data.org name for cross-referencing matches.json
          ESPN_NAME_MAP = { 'Türkiye': 'Turkey' }

          # 1. Get all 48 WC teams
          print("Fetching WC teams...")
          wc_data = fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/teams")
          if not wc_data:
              print("ERROR: Could not fetch WC teams", file=sys.stderr)
              sys.exit(1)
          wc_teams = wc_data['sports'][0]['leagues'][0]['teams']
          print(f"  {len(wc_teams)} teams")

          # 2. Build WC player map: player_id -> {name, country, position, country_logo}
          print("Fetching WC rosters...")
          wc_players = {}
          for t in wc_teams:
              team = t['team']
              tid, tname = team['id'], team['displayName']
              logos = team.get('logos', [])
              country_logo = next((l['href'] for l in logos if 'dark' not in l.get('rel',[])), logos[0]['href'] if logos else '')
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/teams/{tid}/roster"
              roster = fetch(url)
              if not roster:
                  print(f"  WARNING: no roster for {tname}")
                  continue
              for p in roster.get('athletes', []):
                  wc_players[p['id']] = {
                      'name': p['fullName'],
                      'country': tname,
                      'fd_country': ESPN_NAME_MAP.get(tname, tname),
                      'country_logo': country_logo,
                      'position': p.get('position', {}).get('abbreviation', '?')
                  }
          print(f"  {len(wc_players)} WC players indexed")

          # 3. Get all PL teams
          print("Fetching PL teams...")
          pl_data = fetch("https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams?limit=30")
          if not pl_data:
              print("ERROR: Could not fetch PL teams", file=sys.stderr)
              sys.exit(1)
          pl_teams = pl_data['sports'][0]['leagues'][0]['teams']
          print(f"  {len(pl_teams)} PL teams")

          # 4. Fetch PL rosters and cross-reference
          print("Building PL clubs data...")
          result = {}
          for t in pl_teams:
              team = t['team']
              tid, tname = team['id'], team['displayName']
              logo = team.get('logos', [{}])[0].get('href', '')
              url = f"https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/{tid}/roster"
              roster = fetch(url)
              if not roster:
                  continue
              matches = []
              for p in roster.get('athletes', []):
                  pid = p['id']
                  if pid in wc_players:
                      wc = wc_players[pid]
                      matches.append({
                          'name': p['fullName'],
                          'country': wc['country'],
                          'fd_country': wc['fd_country'],
                          'country_logo': wc['country_logo'],
                          'position': wc['position']
                      })
              if matches:
                  result[tname] = {
                      'id': tid,
                      'logo': logo,
                      'players': sorted(matches, key=lambda x: x['country'])
                  }
                  countries = sorted(set(p['country'] for p in matches))
                  print(f"  {tname}: {len(matches)} players - {', '.join(countries)}")

          print(f"\nTotal clubs: {len(result)}")
          if len(result) < 5:
              print("WARNING: suspiciously few clubs — PL rosters may be unavailable (off-season). Keeping existing pl-clubs.json.")
              sys.exit(0)
          with open('pl-clubs.json', 'w') as f:
              json.dump(result, f, indent=2)
          print("Saved pl-clubs.json")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pl-clubs.json
          git diff --staged --quiet || (git commit -m "chore: update PL clubs WC data" && git push)
